name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege: every job reads the repository and nothing more unless it
# says otherwise below.
permissions:
  contents: read

# A new push to a PR supersedes the run on its previous head. Every other run is
# its own group (the run id): GitHub keeps only ONE pending run per group and
# cancels it when another arrives, so a group shared by commit would let a push
# to main fast-forwarded to develop's commit wait on develop's run, and a third
# run on one commit cancel the second.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier
        run: npx prettier --check .

      - name: Run ESLint
        run: npx eslint .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Non-blocking: svelte-check has incomplete Svelte 5 runes support
    # causing false positives. Re-enable when svelte-check improves.
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run svelte-check
        run: npm run check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The Bunko contract (src/lib/interop/contract.ts): the tests read Bunko's
      # exported fixtures from this checkout, and fail rather than skip without it.
      BUNKO_REPO: bunko
      BUNKO_CONTRACT_REQUIRED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Bunko's contract fixtures (interop/contract/), at the ref the repository
      # variable BUNKO_REF names. The contract lives on 0.8/remote-storage until
      # 0.8 is merged into Bunko's main; then BUNKO_REF (and this default) is main.
      - name: Check out the Bunko contract
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: Gnathonic/mokuro-bunko
          # Default moves to Bunko's main when 0.8 merges there.
          ref: ${{ vars.BUNKO_REF || '0.8/remote-storage' }}
          path: bunko
          sparse-checkout: interop/contract
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  release-check:
    name: Release Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only relevant for release PRs (develop -> main); skip on PRs into develop.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    # `gh pr view` reads the PR's labels.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for version and changelog updates
        run: |
          # Check for skip label
          if gh pr view "$PR_NUMBER" --json labels -q '.labels[].name' | grep -q "skip-release-check"; then
            echo "⏭️ Skipping release check (skip-release-check label)"
            exit 0
          fi

          # Get changed files
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)

          # Check for version change
          MAIN_VERSION=$(git show origin/main:package.json | grep '"version"' | sed 's/.*: *"\([^"]*\)".*/\1/')
          PR_VERSION=$(grep '"version"' package.json | sed 's/.*: *"\([^"]*\)".*/\1/')

          VERSION_CHANGED=false
          if [ "$MAIN_VERSION" != "$PR_VERSION" ]; then
            VERSION_CHANGED=true
            echo "✅ Version changed: $MAIN_VERSION → $PR_VERSION"
          fi

          # Check for changelog update
          CHANGELOG_CHANGED=false
          if echo "$CHANGED_FILES" | grep -q "^CHANGELOG.md$"; then
            CHANGELOG_CHANGED=true
            echo "✅ CHANGELOG.md updated"
          fi

          # Both must be present, or neither (for non-release PRs)
          if [ "$VERSION_CHANGED" = true ] && [ "$CHANGELOG_CHANGED" = true ]; then
            echo ""
            echo "✅ Release PR: version bumped and changelog updated"
            exit 0
          elif [ "$VERSION_CHANGED" = false ] && [ "$CHANGELOG_CHANGED" = false ]; then
            echo ""
            echo "✅ Non-release PR: no version or changelog changes"
            exit 0
          else
            echo ""
            echo "❌ Incomplete release changes!"
            echo ""
            if [ "$VERSION_CHANGED" = true ]; then
              echo "   - Version was changed but CHANGELOG.md was not updated"
            else
              echo "   - CHANGELOG.md was updated but version was not bumped"
            fi
            echo ""
            echo "For a release, you must update BOTH:"
            echo "  1. version in package.json"
            echo "  2. CHANGELOG.md with release notes"
            echo ""
            echo "Or add the 'skip-release-check' label to bypass this check."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
